<style>
  :root{
    --cream:#f5f1ea; --warm:#ebe6f2; --rose:#7a66a4; --rose-dk:#5e4e73;
    --gold:#bfa46b; --gold-dk:#9c8550; --brown:#4e4068;
    --blush:#e3d4e8; --text:#2a2433; --muted:#6e6678; --white:#fff;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:#efeaf3;color:var(--text);padding:24px;display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}

  /* ---------- CONTROL PANEL ---------- */
  .panel{background:#fff;border-radius:16px;padding:22px;width:330px;box-shadow:0 4px 24px rgba(78,64,104,.12);position:sticky;top:24px}
  .panel h1{font-family:var(--serif);font-size:23px;color:var(--brown);margin-bottom:4px}
  .panel .sub{font-size:12px;color:var(--muted);margin-bottom:18px}
  label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px;font-weight:500}
  input[type=text],select,textarea{width:100%;padding:9px 11px;border:1px solid #ded7e6;border-radius:8px;font-family:var(--sans);font-size:14px;color:var(--text);background:#fdfcfe}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rose)}
  textarea{resize:vertical;min-height:52px}
  input[type=file]{width:100%;font-size:12px;padding:7px 0}
  .row{display:flex;gap:9px}
  .row>*{flex:1}
  .btn{width:100%;margin-top:18px;padding:12px;border:none;border-radius:9px;background:var(--rose);color:#fff;font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:.04em;cursor:pointer;transition:.2s}
  .btn:hover{background:var(--rose-dk)}
  .btn.ghost{background:transparent;color:var(--rose);border:1px solid var(--rose);margin-top:9px}
  .btn.ghost:hover{background:var(--warm)}
  .hint{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.55;border-top:1px solid #eee7f0;padding-top:12px}

  /* ---------- CANVAS STAGE ---------- */
  .stage{display:flex;flex-direction:column;align-items:center;gap:12px}
  .scaler{transform-origin:top center}
  #post{width:1080px;background:var(--cream);position:relative;overflow:hidden;font-family:var(--sans)}
  #post.f-square{height:1080px}
  #post.f-portrait{height:1350px}
  #post.f-story{height:1920px}

  /* photo area */
  .photo-wrap{position:absolute;inset:0;overflow:hidden;background:var(--warm)}
  .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a99cbc;font-size:34px;letter-spacing:.05em;gap:14px}
  .photo-empty span{font-size:76px;opacity:.5}

  /* ===== STYLE A — bottom gradient band ===== */
  .lay-a .scrim{position:absolute;left:0;right:0;bottom:0;height:62%;
    background:linear-gradient(to top,rgba(42,36,51,.93) 0%,rgba(42,36,51,.78) 38%,rgba(42,36,51,.28) 72%,transparent 100%)}
  .lay-a .content{position:absolute;left:78px;right:78px;bottom:88px;color:#fff}
  .lay-a .eyebrow{font-size:26px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;font-weight:400}
  .lay-a .title{font-family:var(--serif);font-size:88px;line-height:1.05;font-weight:600;margin-bottom:18px}
  .lay-a .desc{font-size:31px;line-height:1.5;font-weight:300;opacity:.9;margin-bottom:26px;max-width:82%}
  .lay-a .price{display:inline-block;background:var(--gold);color:#2a2433;font-size:38px;font-weight:600;padding:14px 34px;border-radius:999px}
  .lay-a .brandbar{position:absolute;left:78px;bottom:36px;right:78px;display:flex;align-items:center;gap:16px;color:rgba(255,255,255,.82);font-size:23px;letter-spacing:.14em}
  .lay-a .brandbar img{width:44px;height:44px;border-radius:50%}

  /* ===== STYLE B — framed card ===== */
  .lay-b{padding:56px;background:var(--cream)}
  .lay-b .inner{position:absolute;inset:56px;border:3px solid var(--gold);overflow:hidden;display:flex;flex-direction:column}
  .lay-b .head{padding:40px 46px 26px;text-align:center;background:var(--cream);flex-shrink:0}
  .lay-b .head img{width:78px;height:78px;border-radius:50%;margin-bottom:14px}
  .lay-b .brandname{font-family:var(--serif);font-size:44px;color:var(--brown);font-weight:600;letter-spacing:.02em}
  .lay-b .tagline{font-size:20px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dk);margin-top:8px}
  .lay-b .photo-wrap{position:relative;inset:auto;flex:1;min-height:0}
  .lay-b .foot{background:var(--cream);padding:32px 46px 40px;text-align:center;flex-shrink:0}
  .lay-b .title{font-family:var(--serif);font-size:70px;color:var(--brown);font-weight:600;line-height:1.1}
  .lay-b .desc{font-size:27px;color:var(--muted);font-weight:300;margin-top:12px;line-height:1.45}
  .lay-b .price{font-size:40px;color:var(--rose);font-weight:600;margin-top:18px}

  /* ===== STYLE C — side panel ===== */
  .lay-c{display:flex}
  .lay-c .photo-wrap{position:relative;inset:auto;width:58%;flex-shrink:0}
  .lay-c .side{width:42%;background:var(--brown);color:#fff;padding:78px 58px;display:flex;flex-direction:column;justify-content:center}
  .lay-c .side img.logo{width:72px;height:72px;border-radius:50%;margin-bottom:34px}
  .lay-c .eyebrow{font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
  .lay-c .title{font-family:var(--serif);font-size:76px;line-height:1.08;font-weight:600;margin-bottom:22px}
  .lay-c .desc{font-size:28px;line-height:1.55;font-weight:300;opacity:.85;margin-bottom:34px}
  .lay-c .price{font-size:44px;font-weight:600;color:var(--gold)}
  .lay-c .handle{margin-top:auto;padding-top:40px;font-size:22px;letter-spacing:.14em;opacity:.7}

  /* ===== STYLE D — text only (announcement) ===== */
  .lay-d{background:linear-gradient(150deg,var(--warm) 0%,var(--blush) 55%,var(--cream) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 92px}
  .lay-d .orn{font-size:64px;color:var(--gold);margin-bottom:30px;letter-spacing:.3em}
  .lay-d .eyebrow{font-size:26px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:30px}
  .lay-d .title{font-family:var(--serif);font-size:112px;line-height:1.06;color:var(--brown);font-weight:600;margin-bottom:30px}
  .lay-d .desc{font-size:34px;line-height:1.6;color:var(--muted);font-weight:300;max-width:80%;margin-bottom:38px}
  .lay-d .price{background:var(--rose);color:#fff;font-size:38px;font-weight:500;padding:17px 46px;border-radius:999px}
  .lay-d .brandbar{position:absolute;bottom:64px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:15px;color:var(--brown);font-size:24px;letter-spacing:.16em;opacity:.75}
  .lay-d .brandbar img{width:46px;height:46px;border-radius:50%}

  .stagenote{font-size:12px;color:var(--muted);text-align:center}
  .backlink{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--rose);text-decoration:none;margin-bottom:14px;padding:6px 12px;border:1px solid #ded7e6;border-radius:999px;background:#fdfcfe;transition:.2s}
  .backlink:hover{background:var(--warm);border-color:var(--rose)}
</style>
</head>
<body>

<div class="panel">
  <a class="backlink" href="/dashboard/">← Back to dashboard</a>
  <h1>Post Maker</h1>
  <div class="sub">H &amp; A Hampers · @h_and_a_hampers</div>

  <label>Template style</label>
  <select id="style">
    <option value="a">A — Photo + bottom overlay</option>
    <option value="b">B — Framed card</option>
    <option value="c">C — Photo + side panel</option>
    <option value="d">D — Text only (sale / greeting)</option>
  </select>

  <label>Size</label>
  <select id="format">
    <option value="f-portrait">Portrait 1080×1350 (best for feed)</option>
    <option value="f-square">Square 1080×1080</option>
    <option value="f-story">Story / Reel 1080×1920</option>
  </select>

  <label>Product photo</label>
  <input type="file" id="photo" accept="image/*">

  <label>Eyebrow (small top text)</label>
  <input type="text" id="eyebrow" value="Handcrafted with love">

  <label>Title</label>
  <input type="text" id="title" value="Personalized Name Jar">

  <label>Description</label>
  <textarea id="desc">Hand-painted, filled with your favourite treats — customised with any name.</textarea>

  <label>Price / badge</label>
  <input type="text" id="price" value="₹599">

  <button class="btn" id="download">Download PNG</button>
  <button class="btn ghost" id="reset">Reset text</button>

  <div class="hint">
    <b>How to use</b><br>
    1. Pick a style + size<br>
    2. Upload the product photo<br>
    3. Edit the text fields<br>
    4. Download PNG → post to Instagram<br><br>
    Leave the price blank to hide the badge.
  </div>
</div>

<div class="stage">
  <div class="scaler" id="scaler">
    <div id="post" class="f-portrait lay-a"></div>
  </div>
  <div class="stagenote">Preview (scaled) — exported at full 1080px resolution</div>
</div>

const post = document.getElementById('post');
const scaler = document.getElementById('scaler');
let photoURL = null;

const F = id => document.getElementById(id).value.trim();

function photoBlock(){
  return photoURL
    ? `<div class="photo-wrap"><img src="${photoURL}"></div>`
    : `<div class="photo-wrap"><div class="photo-empty"><span>🎁</span>Upload a product photo</div></div>`;
}

function render(){
  const style  = document.getElementById('style').value;
  const format = document.getElementById('format').value;
  const eyebrow = F('eyebrow'), title = F('title'), desc = F('desc'), price = F('price');

  post.className = format + ' lay-' + style;

  const logoImg = `<img src="${LOGO}" alt="">`;
  const brandbar = `<div class="brandbar">${logoImg}<span>@h_and_a_hampers</span><span style="margin-left:auto">h-and-a-hampers.com</span></div>`;

  let html = '';
  if (style === 'a') {
    html = photoBlock() + `<div class="scrim"></div>
      <div class="content">
        ${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}
        ${title   ? `<div class="title">${title}</div>` : ''}
        ${desc    ? `<div class="desc">${desc}</div>` : ''}
        ${price   ? `<div class="price">${price}</div>` : ''}
      </div>` + brandbar;
  }
  else if (style === 'b') {
    html = `<div class="inner">
        <div class="head">
          ${logoImg}
          <div class="brandname">H &amp; A Hampers</div>
          ${eyebrow ? `<div class="tagline">${eyebrow}</div>` : ''}
        </div>
        ${photoBlock()}
        <div class="foot">
          ${title ? `<div class="title">${title}</div>` : ''}
          ${desc  ? `<div class="desc">${desc}</div>` : ''}
          ${price ? `<div class="price">${price}</div>` : ''}
        </div>
      </div>`;
  }
  else if (style === 'c') {
    html = photoBlock() + `<div class="side">
        ${logoImg.replace('<img','<img class="logo"')}
        ${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}
        ${title   ? `<div class="title">${title}</div>` : ''}
        ${desc    ? `<div class="desc">${desc}</div>` : ''}
        ${price   ? `<div class="price">${price}</div>` : ''}
        <div class="handle">@h_and_a_hampers</div>
      </div>`;
  }
  else {
    html = `<div class="orn">✦ ✦ ✦</div>
      ${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}
      ${title   ? `<div class="title">${title}</div>` : ''}
      ${desc    ? `<div class="desc">${desc}</div>` : ''}
      ${price   ? `<div class="price">${price}</div>` : ''}
      ${brandbar}`;
  }
  post.innerHTML = html;
  fit();
}

function fit(){
  const maxW = Math.min(window.innerWidth - 430, 520);
  const maxH = window.innerHeight - 120;
  const s = Math.min(maxW/1080, maxH/post.offsetHeight, 1);
  scaler.style.transform = `scale(${s})`;
  scaler.style.height = (post.offsetHeight * s) + 'px';
  scaler.style.width  = (1080 * s) + 'px';
}

['style','format','eyebrow','title','desc','price'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

document.getElementById('photo').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => { photoURL = ev.target.result; render(); };
  r.readAsDataURL(f);
});

document.getElementById('reset').addEventListener('click', ()=>{
  document.getElementById('eyebrow').value = 'Handcrafted with love';
  document.getElementById('title').value   = 'Personalized Name Jar';
  document.getElementById('desc').value    = 'Hand-painted, filled with your favourite treats — customised with any name.';
  document.getElementById('price').value   = '₹599';
  render();
});

document.getElementById('download').addEventListener('click', async ()=>{
  const btn = document.getElementById('download');
  btn.textContent = 'Rendering…'; btn.disabled = true;
  const prev = scaler.style.transform;
  scaler.style.transform = 'scale(1)';
  try{
    const canvas = await html2canvas(post, {scale:1, useCORS:true, backgroundColor:null,
      width:1080, height:post.offsetHeight, logging:false});
    const a = document.createElement('a');
    const slug = (F('title')||'post').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    a.download = `handa-${slug}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }catch(err){ alert('Render failed: '+err.message); }
  scaler.style.transform = prev;
  btn.textContent = 'Download PNG'; btn.disabled = false;
});

window.addEventListener('resize', fit);
document.fonts.ready.then(render);
render();
</script>
</body>
</html>
