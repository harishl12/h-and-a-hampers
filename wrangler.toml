# Cloudflare Worker configuration for H & A Hampers.
# This project runs under Cloudflare's unified Workers model: a single Worker
# (src/index.js) serves static files from /public and handles the API routes
# under /.netlify/functions/*. Env vars (DASHBOARD_PASSWORD, DASHBOARD_SECRET,
# RESEND_API_KEY, ALLOWED_EMAILS) are set in the dashboard under
# Settings -> Variables and Secrets.

name = "h-and-a-hampers"
main = "src/index.js"
compatibility_date = "2024-09-01"

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "none"

# KV namespace binding for products, images, analytics, OTP, rate-limiting,
# and form submissions (see functions/.netlify/functions/*.js).
[[kv_namespaces]]
binding = "HA_KV"
id = "4f1edae719d1410fa5df9e71172e751b"
