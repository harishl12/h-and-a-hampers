# Cloudflare Pages configuration for H & A Hampers.
# The Pages project itself, its KV binding and env vars are set up in the
# Cloudflare dashboard (Workers & Pages -> h-and-a-hampers -> Settings).
# This file documents the intended binding names and is used by `wrangler
# pages dev` for local testing.

name = "h-and-a-hampers"
pages_build_output_dir = "public"
compatibility_date = "2024-09-01"

# KV namespace binding — create the namespace in the Cloudflare dashboard
# (Workers & Pages -> KV) and bind it here as HA_KV. Replace the id below
# with the real namespace id once created.
[[kv_namespaces]]
binding = "HA_KV"
id = "4f1edae719d1410fa5df9e71172e751b"
